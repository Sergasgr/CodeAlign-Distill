[project]
name = "codealign-distill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "runtime: needs CodeAlign-Runtime installed",
]
